// ================================================================
// DATE HELPERS
// ================================================================
function todayISO() { return toISO(new Date()); }
function toISO(d) {
  // локальні компоненти дати, НЕ toISOString() — інакше UTC-конвертація зсуває дату
  // на день назад уночі для часових поясів попереду UTC (напр. Україна після півночі)
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function fmtDate(iso) { return new Date(iso + "T00:00:00").toLocaleDateString("uk-UA", { day: "numeric", month: "long" }); }
function fmtDateFull(iso) { return new Date(iso + "T00:00:00").toLocaleDateString("uk-UA", { day: "numeric", month: "long", year: "numeric" }); }
function daysUntil(iso) {
  const today = new Date(todayISO() + "T00:00:00");
  const target = new Date(iso + "T00:00:00");
  return Math.round((target - today) / 86400000);
}
function addDays(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return toISO(d); }
function addMonths(iso, n) { const d = new Date(iso + "T00:00:00"); d.setMonth(d.getMonth() + n); return toISO(d); }
function onDay(year, monthIdx, day) { return toISO(new Date(year, monthIdx, day)); }
function ymd(iso) { const d = new Date(iso + "T00:00:00"); return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate() }; }
function quarterEnd(iso) {
  const { y, m } = ymd(iso);
  const endMonth = Math.floor(m / 3) * 3 + 3;
  return toISO(new Date(y, endMonth, 0));
}
function quarterStart(iso) {
  const { y, m } = ymd(iso);
  return toISO(new Date(y, Math.floor(m / 3) * 3, 1));
}
function nextQuarterEndFrom(iso) {
  const qe = quarterEnd(iso);
  return qe >= iso ? qe : quarterEnd(addMonths(iso, 3));
}
function daysInMonth(year, monthIdx) { return new Date(year, monthIdx + 1, 0).getDate(); }
function firstOfNextMonth(iso) { const { y, m } = ymd(iso); return toISO(new Date(y, m + 1, 1)); }

// ================================================================

const ORG_FORMS = [

};
function systemLabel(orgForm, taxSystem) {

}

// ЄСВ "за себе" — офіційні підстави звільнення ФОП (ст. 4 Закону про ЄСВ, Держбюджет-2026)
const ESV_EXEMPT_REASONS = [

  { id: "pension", label: "Пенсіонер за віком або за вислугу років" },
  { id: "employed_main", label: "Офіційно працевлаштований(-а) за основним місцем роботи" },

];
function esvReasonLabel(id) { return ESV_EXEMPT_REASONS.find((r) => r.id === id)?.label || id; }

const FLAG_GROUPS = [

    { id: "fea", label: "Веде ЗЕД (отримує валютну виручку)", note: "+ звіт про валютні операції, валютний контроль" },

    { id: "land", label: "Земля", note: "+ плата за землю / земельний податок" },
  ]},
];

const ESV_TASK_TITLE = "ЄСВ ФОП «за себе» за квартал";

// Тип супроводу ФОП-клієнта — визначає, що саме бухгалтер робить сама, а що лише перевіряє
const SERVICE_LEVELS = [
  { id: "monthly", label: "Щомісячний супровід", note: "Повний супровід: сплата податків, подання звітів, ведення книги доходів." },
  { id: "quarterly", label: "Щоквартальний супровід", note: "Ведення книги доходів, контроль сплати податків, перевірка виписки." },
  { id: "annual", label: "Річний супровід", note: "Ведення книги доходів, подання річного звіту, перевірка сплати податків." },
];
function serviceLevelLabel(id) { return SERVICE_LEVELS.find((s) => s.id === id)?.label || id; }

// ================================================================
// TAX PROFILE HELPERS — history & exemption periods
// ================================================================
// client.history: [{ id, from: ISO, orgForm, taxSystem }] sorted ascending by `from`
function systemAt(client, iso) {
  const hist = [...(client.history || [])].sort((a, b) => a.from.localeCompare(b.from));
  if (hist.length === 0) return { orgForm: client.orgForm, taxSystem: client.taxSystem };
  let current = hist[0];
  for (const h of hist) { if (h.from <= iso) current = h; else break; }
  return current;
}
function currentSystem(client) { return systemAt(client, todayISO()); }

// client.esvPeriods: [{ id, from: ISO, to: ISO|null, reason }]
function esvCoverage(client, startISO, endISO) {
  const periods = client.esvPeriods || [];
  if (periods.length === 0) return "none";
  let anyExempt = false, anyNot = false;
  let d = startISO;
  let guard = 0;
  while (d <= endISO && guard < 120) {
    const covered = periods.some((p) => p.from <= d && (!p.to || p.to >= d));
    if (covered) anyExempt = true; else anyNot = true;
    d = addDays(d, 1);
    guard++;
  }
  if (anyExempt && !anyNot) return "full";
  if (!anyExempt) return "none";
  return "partial";
}
// Найраніша дата в історії клієнта — фактичний початок діяльності/реєстрації
function registrationDate(client) {
  const hist = client.history || [];
  if (!hist.length) return null;
  return [...hist].sort((a, b) => a.from.localeCompare(b.from))[0].from;
}

// Частота зобов'язання: чим вище ранг, тим частіше воно виникає
const CADENCE_RANK = { monthly: 3, quarterly: 2, annual: 1 };

// ================================================================
// TAX CALENDAR GENERATOR — period-aware: the system/exemption in effect
// at each reporting period's end date governs that period's tasks.
// ================================================================
function generateTasksForClient(client, fromISO) {
  const tasks = [];
  const push = (title, type, due, note, cadence) => tasks.push({ title, type, due, note: note || "", _cadence: cadence || null });
  const flags = client.flags || [];
  const has = (f) => flags.includes(f);
  const regDate = registrationDate(client);

  // ---- Quarterly cycle: ЄСВ + ЄП-декларації, залежно від системи, чинної на кінець кожного кварталу ----
  let qEnd = nextQuarterEndFrom(fromISO);
  for (let i = 0; i < 4; i++) {
    const qStart = quarterStart(qEnd);
    const sysHere = systemAt(client, qEnd);
    const isFop = sysHere.orgForm === "fop";
    const sys = sysHere.taxSystem;
    const { y: qy, m: qm } = ymd(qEnd);

    if (isFop) {
      const due = onDay(qy, qm + 1, 19);
      // дні до реєстрації клієнта не рахуються як "неexempt" — інакше щойно зареєстрований ФОП
      // з пільгою від першого дня завжди виглядав би як "частковий період"
      const effectiveStart = regDate && regDate > qStart ? regDate : qStart;
      const coverage = effectiveStart > qEnd ? "full" : esvCoverage(client, effectiveStart, qEnd);
      if (coverage === "none") {
        push(ESV_TASK_TITLE, "payment", due, "Нормативна задача — сплачується щоквартально всіма ФОП незалежно від групи.", "quarterly");
      } else if (coverage === "partial") {
        push(`${ESV_TASK_TITLE} (частковий період)`, "payment", due, "У кварталі є як звільнені, так і незвільнені дні — перевірте пропорційний розрахунок вручну.", "quarterly");
      }
      // "full" — звільнення покриває весь квартал (або клієнт ще не існував), задача не генерується
    }

    if (sys === "fop3" || sys === "legal_sp3") {
      const declDue = addDays(qEnd, 40);
      const payDue = addDays(declDue, 10);
      push(`Декларація ЄП — ${isFop ? "ФОП 3 групи" : "юрособа, гр. 3"}`, "document", declDue, "Нормативний термін: 40 днів після завершення кварталу.", "quarterly");
      push(`ЄП — ${isFop ? "ФОП 3 групи" : "юрособа гр.3"} (сплата)`, "payment", payDue, "Сплачується протягом 10 днів після граничного строку подання декларації.", "quarterly");
      if (isFop) push("ВЗ — ФОП 3 групи (військовий збір, 1% доходу)", "payment", payDue, "Сплачується разом із єдиним податком.", "quarterly");
    }
    if (sys === "legal_general" && (client.profitReportingPeriod || "quarterly") === "quarterly") {
      const declDue = addDays(qEnd, 40);
      push("Декларація з податку на прибуток (квартальна)", "document", declDue, "Наростаючим підсумком з початку року.", "quarterly");
      push("Податок на прибуток (сплата)", "payment", addDays(declDue, 10), null, "quarterly");
      push("Проміжна фінансова звітність (баланс, звіт про фінрезультати)", "document", addDays(qEnd, 30), "Подається до ДПС і Держстату не пізніше 30-го числа місяця, що настає за звітним кварталом — раніше за саму декларацію з прибутку.", "quarterly");
    }
    if (sys === "legal_sp4") {
      push("ЄП 4 група — квартальний авансовий платіж", "payment", addDays(qEnd, 30), null, "quarterly");
    }

    qEnd = quarterEnd(addMonths(qEnd, 3));
  }

  // ---- Monthly cycle: ЄП + ВЗ для 1/2 групи ФОП, залежно від системи, чинної на кінець місяця ----
  let mCursor = fromISO;
  for (let i = 0; i < 13; i++) {
    const { y, m } = ymd(mCursor);
    const monthEnd = toISO(new Date(y, m + 1, 0));
    const sysHere = systemAt(client, monthEnd);
    const due = onDay(y, m, 20);
    if (sysHere.orgForm === "fop" && (sysHere.taxSystem === "fop1" || sysHere.taxSystem === "fop2") && due >= fromISO) {
      const groupLabel = sysHere.taxSystem === "fop1" ? "1 група" : "2 група";
      push(`Єдиний податок — ${groupLabel}`, "payment", due, null, "monthly");
      push(`Військовий збір — ${groupLabel}`, "payment", due, "Фіксований авансовий внесок, сплачується разом із єдиним податком.", "monthly");
    }
    mCursor = addMonths(mCursor, 1);
  }

  // ---- Annual: декларація ЄП для 1/2 групи ФОП (до 9 лютого) ----
  {
    const year = ymd(fromISO).y;
    let declDue = onDay(year, 1, 9);
    if (declDue < fromISO) declDue = onDay(year + 1, 1, 9);
    const sysHere = systemAt(client, declDue);
    if (sysHere.orgForm === "fop" && (sysHere.taxSystem === "fop1" || sysHere.taxSystem === "fop2")) {
      push("Декларація платника єдиного податку (річна)", "document", declDue, "Річна декларація — навіть за відсутності діяльності.", "annual");
    }
  }
  // ---- Annual: декларація про майновий стан і доходи — ФОП на загальній системі (до 1 травня) ----
  {
    const year = ymd(fromISO).y;
    let declDue = onDay(year, 4, 1);
    if (declDue < fromISO) declDue = onDay(year + 1, 4, 1);
    const sysHere = systemAt(client, declDue);
    if (sysHere.orgForm === "fop" && sysHere.taxSystem === "fop_general") {
      push("Декларація про майновий стан і доходи (річна)", "document", declDue, "Подається раз на рік, якщо був дохід у звітному періоді.", "annual");
    }
  }
  // ---- Annual: декларація з прибутку + фінзвітність — юрособа на загальній системі, якщо обрано річний період ----
  {
    const year = ymd(fromISO).y;
    let yearEnd = onDay(year, 11, 31);
    let declDue = addDays(yearEnd, 60);
    if (declDue < fromISO) { yearEnd = onDay(year + 1, 11, 31); declDue = addDays(yearEnd, 60); }
    const sysHere = systemAt(client, declDue);
    if (sysHere.taxSystem === "legal_general" && (client.profitReportingPeriod || "quarterly") === "annual") {
      push("Декларація з податку на прибуток (річна)", "document", declDue, "Граничний строк — 60 календарних днів після завершення звітного року.", "annual");
      push("Податок на прибуток (сплата)", "payment", addDays(declDue, 10), null, "annual");
      push("Річна фінансова звітність (баланс, звіт про фінрезультати)", "document", declDue, "Подається разом із річною декларацією з податку на прибуток.", "annual");
    }
  }
  // ---- Annual: декларація ЄП 4 група (до 20 лютого) ----
  {
    const year = ymd(fromISO).y;
    let declDue = onDay(year, 1, 20);
    if (declDue < fromISO) declDue = onDay(year + 1, 1, 20);
    const sysHere = systemAt(client, declDue);
    if (sysHere.taxSystem === "legal_sp4") {
      push("Декларація платника ЄП (4 група, сільгосп)", "document", declDue, "Подається щорічно до 20 лютого.", "annual");
    }
  }

  // ---- Перехідна звітність: попередня система в історії, якщо клієнт змінював систему ----
  {
    const hist = [...(client.history || [])].sort((a, b) => a.from.localeCompare(b.from));
    for (let i = 1; i < hist.length; i++) {
      const prev = hist[i - 1];
      const switchDate = hist[i].from;
      if (switchDate < fromISO) continue; // перехід уже в минулому — не нагадуємо заново
      push(
        `Перевірити перехідну звітність (${systemLabel(prev.orgForm, prev.taxSystem)} → ${systemLabel(hist[i].orgForm, hist[i].taxSystem)})`,
        "document",
        addDays(switchDate, 5),
        `Період на попередній системі: з ${fmtDate(prev.from)} по ${fmtDate(addDays(switchDate, -1))}. Перевірте, чи потрібна окрема закриваюча звітність за цей період — автоматична логіка цього не визначає.`
      );
    }
  }

  // ---- Додаткові ознаки (не прив'язані до періодів — застосовуються, поки увімкнені) ----
  if (has("employees")) {
    let cursor = fromISO;
    for (let i = 0; i < 6; i++) {
      const { y, m } = ymd(cursor);
      push("ПДФО, ВЗ і ЄСВ із зарплати працівників", "payment", onDay(y, m + 1, 20), null, "monthly");
      cursor = addMonths(cursor, 1);
    }
    let qe = nextQuarterEndFrom(fromISO);
    for (let i = 0; i < 4; i++) {
      push("Об'єднана звітність (Додаток 4ДФ)", "document", addDays(qe, 40), null, "quarterly");
      qe = quarterEnd(addMonths(qe, 3));
    }
  }
  if (has("fea")) {
    let qe = nextQuarterEndFrom(fromISO);
    for (let i = 0; i < 4; i++) {
      push("Звіт про валютні операції (ЗЕД)", "document", addDays(qe, 30), "Подається при отриманні/русі валютної виручки протягом кварталу.", "quarterly");
      qe = quarterEnd(addMonths(qe, 3));
    }
  }
  if (has("realestate")) {
    const year = ymd(fromISO).y;
    let due = onDay(year, 1, 20);
    if (due < fromISO) due = onDay(year + 1, 1, 20);
    push("Податок на нерухоме майно (декларація)", "document", due, "Річна декларація для власників нежитлової/понадлімітної нерухомості.", "annual");
  }
  if (has("land")) {
    const year = ymd(fromISO).y;
    let due = onDay(year, 1, 20);
    if (due < fromISO) due = onDay(year + 1, 1, 20);
    push("Плата за землю (декларація)", "document", due, null, "annual");
  }

  // ---- КЕП: нагадування за 5 днів до закінчення строку дії (завжди її задача, тип супроводу не впливає) ----
  if (client.kepExpiry) {
    let due = addDays(client.kepExpiry, -5);
    const expired = client.kepExpiry < fromISO;
    if (due < fromISO) due = fromISO;
    push(
      expired ? "Оформити новий КЕП — строк дії закінчився" : "Оформити новий КЕП",
      "document",
      due,
      `Термін дії поточного КЕП: ${fmtDateFull(client.kepExpiry)}. Задача створена автоматично за 5 днів до закінчення.`
    );
  }

  return applyServiceLevel(client, tasks, fromISO).sort((a, b) => a.due.localeCompare(b.due));
}

// Накладає тип супроводу ФОП на вже згенеровані задачі за принципом частоти:
// вона виконує (платить/подає) зобов'язання сама, якщо її частота супроводу є не рідшою за
// природну частоту зобов'язання (щомісячний ⊇ щоквартальний ⊇ річний). Інакше — лише перевіряє.
// Книгу обліку доходів і банківську виписку вона веде щомісяця незалежно від типу супроводу.
function applyServiceLevel(client, tasks, fromISO) {
  const sys = systemAt(client, fromISO);
  if (sys.orgForm !== "fop") return tasks; // стосується лише ФОП

  const sl = client.serviceLevel || "monthly";
  const serviceRank = CADENCE_RANK[sl];

  let result = tasks.map((t) => {
    if (!t._cadence) return t; // напр. КЕП — завжди її задача, тип супроводу не змінює
    const obligationRank = CADENCE_RANK[t._cadence];
    const executesHerself = serviceRank >= obligationRank;
    if (executesHerself) return t;
    const isDoc = t.type === "document";
    return {
      ...t,
      title: `${isDoc ? "Перевірити подання" : "Перевірити сплату"}: ${t.title}`,
      note: `${t.note ? t.note + " " : ""}${isDoc ? "Подається без вашої участі — перевірте факт подання вчасно." : "Клієнт сплачує самостійно — перевірте факт і своєчасність оплати."}`,
    };
  });

  // Книга обліку доходів + банківська виписка — частота і прив'язка до дати залежать від типу супроводу:
  // щомісячний — щомісяця; щоквартальний — у перші 10 днів після кварталу, перед поданням декларації;
  // річний — перший тиждень січня, перед поданням річного звіту.
  const regDate = registrationDate(client);
  const afterReg = (d) => !regDate || d >= regDate;

  if (sl === "monthly") {
    let cursor = fromISO;
    for (let i = 0; i < 7; i++) {
      const { y, m } = ymd(cursor);
      const stmtDue = onDay(y, m, 5);
      const bookDue = onDay(y, m, 10);
      if (stmtDue >= fromISO && afterReg(stmtDue)) {
        result.push({ title: "Перевірити банківську виписку", type: "document", due: stmtDue, note: "Звірити надходження на рахунку з книгою обліку доходів за попередній місяць." });
      }
      if (bookDue >= fromISO && afterReg(bookDue)) {
        result.push({ title: "Заповнити книгу обліку доходів", type: "document", due: bookDue, note: "Внести операції попереднього місяця до книги обліку доходів." });
      }
      cursor = addMonths(cursor, 1);
    }
  } else if (sl === "quarterly") {
    let qe = nextQuarterEndFrom(fromISO);
    for (let i = 0; i < 4; i++) {
      const due = addDays(qe, 10);
      if (due >= fromISO && afterReg(due)) {
        result.push({ title: "Перевірити банківську виписку за квартал", type: "document", due, note: "У перші 10 днів після кварталу, перед поданням декларації." });
        result.push({ title: "Заповнити книгу обліку доходів за квартал", type: "document", due, note: "У перші 10 днів після кварталу, перед поданням декларації." });
      }
      qe = quarterEnd(addMonths(qe, 3));
    }
  } else if (sl === "annual") {
    const year = ymd(fromISO).y;
    let due = onDay(year, 0, 7);
    if (due < fromISO) due = onDay(year + 1, 0, 7);
    if (afterReg(due)) {
      result.push({ title: "Перевірити банківську виписку за рік", type: "document", due, note: "Перший тиждень січня, перед поданням річного звіту." });
      result.push({ title: "Заповнити книгу обліку доходів за рік", type: "document", due, note: "Перший тиждень січня, перед поданням річного звіту." });
    }
  }

  return result;
}

// Перегенеровує лише МАЙБУТНІ автозгенеровані задачі клієнта (не чіпає виконані/минулі й ручні задачі)
function resyncFutureGeneratedTasks(state, clientId) {
  const today = todayISO();
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return state.tasks;
  const kept = state.tasks.filter((t) => !(t.clientId === clientId && t.generated && !t.done && t.due >= today));
  const fresh = generateTasksForClient(client, today).map((t) => ({ id: uid(), clientId, done: false, status: "planned", amount: null, generated: true, ...t }));
  return [...kept, ...fresh];
}

async function loadState(userId) {
  try {
    const { data, error } = await supabase.from("app_state").select("data").eq("user_id", userId).maybeSingle();
    if (error) { console.error("Load failed", error); return null; }
    return data ? data.data : null;
  } catch (e) { console.error("Load failed", e); return null; }
}
async function saveState(userId, state) {
  try {
    const { error } = await supabase.from("app_state").upsert({ user_id: userId, data: state, updated_at: new Date().toISOString() });
    if (error) console.error("Save failed", error);
  } catch (e) { console.error("Save failed", e); }
}
const DEFAULT_STATE = { profile: { name: "", email: "" }, clients: [], tasks: [], onboarded: false };

// ================================================================
const TASK_TYPES = [
  { id: "document", label: "Документ", icon: FileText, color: "#3b5bff", bg: "#e8ecff" },
  { id: "payment", label: "Оплата", icon: Wallet, color: "#0ea78c", bg: "#dff5f0" },
  { id: "event", label: "Подія", icon: Calendar, color: "#64748b", bg: "#eef1f4" },
  { id: "personal", label: "Особисте", icon: Sparkles, color: ORANGE, bg: ORANGE_SOFT },
];
const typeMeta = (id) => TASK_TYPES.find((t) => t.id === id) || TASK_TYPES[0];
const money = (n) => new Intl.NumberFormat("uk-UA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);

// ================================================================
// APP
// ================================================================
function App({ userId, userEmail, onSignOut }) {
  const [state, setState] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("dashboard");
  const [showAddClient, setShowAddClient] = useState(false);
  const [showAddTask, setShowAddTask] = useState(false);
  const [openClientId, setOpenClientId] = useState(null);
  const [selectedTaskId, setSelectedTaskId] = useState(null);
  const [showAddMenu, setShowAddMenu] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    (async () => {
      const loaded = await loadState(userId);
      setState(loaded || DEFAULT_STATE);
      setLoading(false);
    })();
  }, [userId]);

  const persist = useCallback((next) => { setState(next); saveState(userId, next); }, [userId]);
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2400); };

  if (loading) {
    return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", background: CREAM, color: TEXT_MUTED, fontFamily: "system-ui" }}>Завантаження…</div>;
  }
  if (!state.onboarded) {
    return <Onboarding defaultEmail={userEmail} onDone={(profile) => persist({ ...state, profile, onboarded: true })} />;
  }

  const addClient = (client) => {
    const clientId = uid();
    const full = { id: clientId, name: client.name, flags: client.flags, history: client.history, esvPeriods: client.esvPeriods, kepExpiry: client.kepExpiry || null, profitReportingPeriod: client.profitReportingPeriod || "quarterly", serviceLevel: client.serviceLevel || "monthly", rnokpp: client.rnokpp || null, regAddress: client.regAddress || null, kveds: client.kveds || null };
    const generated = generateTasksForClient(full, todayISO()).map((t) => ({ id: uid(), clientId, done: false, status: "planned", amount: null, generated: true, ...t }));
    persist({ ...state, clients: [...state.clients, full], tasks: [...state.tasks, ...generated] });
    showToast(`Клієнта додано · згенеровано ${generated.length} задач`);
  };

  const deleteClient = (id) => {
    persist({ ...state, clients: state.clients.filter((c) => c.id !== id), tasks: state.tasks.filter((t) => t.clientId !== id) });
    if (openClientId === id) setOpenClientId(null);
    showToast("Клієнта видалено.");
  };

  const changeClientSystem = (clientId, orgForm, taxSystem, fromDate) => {
    const clients = state.clients.map((c) => c.id === clientId
      ? { ...c, history: [...c.history, { id: uid(), from: fromDate, orgForm, taxSystem }].sort((a, b) => a.from.localeCompare(b.from)) }
      : c);
    const next = { ...state, clients };
    persist({ ...next, tasks: resyncFutureGeneratedTasks(next, clientId) });
    showToast(`Систему оновлено з ${fmtDate(fromDate)} — календар перераховано.`);
  };

  const addEsvPeriod = (clientId, period) => {
    const clients = state.clients.map((c) => c.id === clientId ? { ...c, esvPeriods: [...(c.esvPeriods || []), period] } : c);
    const next = { ...state, clients };
    persist({ ...next, tasks: resyncFutureGeneratedTasks(next, clientId) });
    showToast("Період звільнення додано — календар перераховано.");
  };

  const removeEsvPeriod = (clientId, periodId) => {
    const clients = state.clients.map((c) => c.id === clientId ? { ...c, esvPeriods: (c.esvPeriods || []).filter((p) => p.id !== periodId) } : c);
    const next = { ...state, clients };
    persist({ ...next, tasks: resyncFutureGeneratedTasks(next, clientId) });
    showToast("Період звільнення видалено — календар перераховано.");
  };

  const updateProfitPeriod = (clientId, period) => {
    const clients = state.clients.map((c) => c.id === clientId ? { ...c, profitReportingPeriod: period } : c);
    const next = { ...state, clients };
    persist({ ...next, tasks: resyncFutureGeneratedTasks(next, clientId) });
    showToast(period === "annual" ? "Перехід на річну декларацію — календар перераховано." : "Перехід на квартальні декларації — календар перераховано.");
  };

  const updateServiceLevel = (clientId, level) => {
    const clients = state.clients.map((c) => c.id === clientId ? { ...c, serviceLevel: level } : c);
    const next = { ...state, clients };
    persist({ ...next, tasks: resyncFutureGeneratedTasks(next, clientId) });
    showToast(`Тип супроводу змінено на «${serviceLevelLabel(level)}» — календар перераховано.`);
  };

  const updateRegistrationInfo = (clientId, info) => {
    persist({ ...state, clients: state.clients.map((c) => c.id === clientId ? { ...c, ...info } : c) });
    showToast("Реєстраційні дані оновлено.");
  };

  const updateFlags = (clientId, flags) => {
    const clients = state.clients.map((c) => c.id === clientId ? { ...c, flags } : c);
    const next = { ...state, clients };
    persist({ ...next, tasks: resyncFutureGeneratedTasks(next, clientId) });
    showToast("Додаткові ознаки оновлено — календар перераховано.");
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `terminal-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Дані експортовано.");
  };

  const importData = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed || !Array.isArray(parsed.clients) || !Array.isArray(parsed.tasks)) throw new Error("bad shape");
        persist(parsed);
        showToast("Дані відновлено з файлу.");
      } catch {
        showToast("Не вдалося прочитати файл — перевірте формат.");
      }
    };
    reader.readAsText(file);
  };

  const addTask = (task) => {
    const base = { id: uid(), done: false, status: "planned", amount: task.amount ?? null, generated: false, ...task };
    const items = [base];
    if (task.repeat && task.repeat.count > 1) {
      for (let i = 1; i < task.repeat.count; i++) {
        const due = task.repeat.unit === "month" ? addMonths(task.due, i * task.repeat.every)
          : task.repeat.unit === "quarter" ? addMonths(task.due, i * task.repeat.every * 3)
          : addMonths(task.due, i * task.repeat.every * 12);
        items.push({ ...base, id: uid(), due });
      }
    }
    persist({ ...state, tasks: [...state.tasks, ...items] });
    showToast(items.length > 1 ? `Створено серію з ${items.length} задач` : "Задачу додано");
  };

  const toggleTask = (id) => persist({ ...state, tasks: state.tasks.map((t) => (t.id === id ? { ...t, done: !t.done, status: !t.done ? "done" : "planned" } : t)) });
  const deleteTask = (id) => { persist({ ...state, tasks: state.tasks.filter((t) => t.id !== id) }); if (selectedTaskId === id) setSelectedTaskId(null); };
  const updateTask = (id, patch) => persist({ ...state, tasks: state.tasks.map((t) => (t.id === id ? { ...t, ...patch } : t)) });

  const openClient = state.clients.find((c) => c.id === openClientId);
  const selectedTask = state.tasks.find((t) => t.id === selectedTaskId);
  const selectedTaskClient = selectedTask ? state.clients.find((c) => c.id === selectedTask.clientId) : null;

  return (
    <div style={{ fontFamily: "system-ui, -apple-system, sans-serif", background: CREAM, minHeight: "100vh", maxWidth: 480, margin: "0 auto", position: "relative", paddingBottom: 84 }}>
      {openClient ? (
        <ClientDetail
          client={openClient}
          tasks={state.tasks.filter((t) => t.clientId === openClient.id)}
          onBack={() => setOpenClientId(null)}
          onToggle={toggleTask}
          onDelete={deleteTask}
          onOpen={setSelectedTaskId}
          onAddTask={() => setShowAddTask(true)}
          onChangeSystem={(orgForm, taxSystem, fromDate) => changeClientSystem(openClient.id, orgForm, taxSystem, fromDate)}
          onAddEsvPeriod={(period) => addEsvPeriod(openClient.id, period)}
          onRemoveEsvPeriod={(periodId) => removeEsvPeriod(openClient.id, periodId)}
          onUpdateProfitPeriod={(period) => updateProfitPeriod(openClient.id, period)}
          onUpdateServiceLevel={(level) => updateServiceLevel(openClient.id, level)}
          onUpdateRegistrationInfo={(info) => updateRegistrationInfo(openClient.id, info)}
          onUpdateFlags={(flags) => updateFlags(openClient.id, flags)}
        />
      ) : (
        <>
          <Header tab={tab} profile={state.profile} clientCount={state.clients.length} tasks={state.tasks} clients={state.clients} onOpenTask={setSelectedTaskId} />
          <div style={{ padding: "0 16px" }}>
            {tab === "dashboard" && <Dashboard tasks={state.tasks} clients={state.clients} onToggle={toggleTask} onOpen={setSelectedTaskId} />}
            {tab === "calendar" && <CalendarView tasks={state.tasks} clients={state.clients} onToggle={toggleTask} onOpen={setSelectedTaskId} />}
            {tab === "clients" && (
              <ClientsView clients={state.clients} tasks={state.tasks} onDelete={deleteClient} onOpen={setOpenClientId} onAddClient={() => setShowAddClient(true)} />
            )}
            {tab === "profile" && <ProfileView profile={state.profile} clientCount={state.clients.length} onUpdate={(p) => persist({ ...state, profile: p })} onExport={exportData} onImport={importData} onSignOut={onSignOut} />}
          </div>
        </>
      )}

      {toast && (
        <div style={{ position: "fixed", bottom: 96, left: "50%", transform: "translateX(-50%)", background: NAVY, color: "#fff", padding: "10px 20px", borderRadius: 24, fontSize: 14, zIndex: 60, boxShadow: "0 8px 24px rgba(0,0,0,0.2)", textAlign: "center", maxWidth: 380 }}>
          {toast}
        </div>
      )}

      {showAddMenu && (
        <Modal onClose={() => setShowAddMenu(false)} title="Додати">
          <button
            onClick={() => { setShowAddMenu(false); setShowAddTask(true); }}
            style={{ width: "100%", marginBottom: 10, background: NAVY, color: "#fff", border: "none", borderRadius: 12, padding: "15px 0", fontSize: 15, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
          >
            <Plus size={18} /> Додати задачу
          </button>
          <button
            onClick={() => { setShowAddMenu(false); setShowAddClient(true); }}
            style={{ width: "100%", background: ORANGE, color: "#fff", border: "none", borderRadius: 12, padding: "15px 0", fontSize: 15, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
          >
            <Plus size={18} /> Додати клієнта
          </button>
        </Modal>
      )}
      {showAddClient && <AddClientFlow onClose={() => setShowAddClient(false)} onSave={(client) => { addClient(client); setShowAddClient(false); }} />}
      {showAddTask && (
        <AddTaskModal clients={state.clients} presetClientId={openClientId} onClose={() => setShowAddTask(false)} onSave={(t) => { addTask(t); setShowAddTask(false); }} />
      )}
      {selectedTask && (
        <TaskDetailModal
          task={selectedTask}
          client={selectedTaskClient}
          onClose={() => setSelectedTaskId(null)}
          onTakeInProgress={() => updateTask(selectedTask.id, { status: "in_progress" })}
          onComplete={(amount) => { updateTask(selectedTask.id, { status: "done", done: true, amount: amount ?? selectedTask.amount ?? null }); showToast("Задачу виконано"); setSelectedTaskId(null); }}
          onReopen={() => updateTask(selectedTask.id, { status: "planned", done: false })}
          onDelete={() => { deleteTask(selectedTask.id); showToast("Задачу видалено."); }}
          onEdit={(patch) => { updateTask(selectedTask.id, patch); showToast("Задачу оновлено."); }}
        />
      )}

      {!openClient && <BottomNav tab={tab} setTab={setTab} onAdd={() => setShowAddMenu(true)} />}
    </div>
  );
}

const inputStyleDark = { background: "#2e2e2e", border: "1px solid #454545", borderRadius: 10, padding: "12px 14px", color: "#fff", fontSize: 15, outline: "none" };

// ================================================================
function Header({ tab, profile, clientCount, tasks, clients, onOpenTask }) {
  const [showNotifs, setShowNotifs] = useState(false);
  const titles = {
    dashboard: `Доброго дня, ${profile.name.split(" ")[0] || ""}`,
    calendar: "Календар",
    clients: "Клієнти",
    profile: "Профіль і налаштування",
  };
  const title = titles[tab];
  const subtitle = tab === "clients" ? `${clientCount} суб'єкт${clientCount === 1 ? "" : clientCount >= 2 && clientCount <= 4 ? "и" : "ів"} господарювання` : null;

  const notifTasks = (tasks || [])
    .filter((t) => !t.done && daysUntil(t.due) <= 3)
    .sort((a, b) => a.due.localeCompare(b.due));
  const overdueCount = notifTasks.filter((t) => daysUntil(t.due) < 0).length;

  return (
    <div style={{ background: NAVY, padding: "20px 16px 24px", color: "#fff" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div>
          <div style={{ display: "inline-flex", alignItems: "center", gap: 7, background: "rgba(255,255,255,0.14)", padding: "7px 16px 7px 12px", borderRadius: 22, fontSize: 15, fontWeight: 800, letterSpacing: 0.3 }}>
            <span style={{ width: 8, height: 8, borderRadius: "50%", background: "#f6c453" }} /> TERMINAL
          </div>
          <div style={{ fontSize: 25, fontWeight: 800, marginTop: 10, letterSpacing: -0.3 }}>{title}</div>
          {subtitle && <div style={{ color: "#c9c7c0", fontSize: 14, marginTop: 2 }}>{subtitle}</div>}
        </div>
        <button onClick={() => setShowNotifs(true)} style={{ background: "none", border: "none", cursor: "pointer", position: "relative", marginTop: 4, padding: 0 }}>
          <Bell size={22} color="#fff" style={{ opacity: 0.85 }} />
          {notifTasks.length > 0 && (
            <span style={{ position: "absolute", top: -4, right: -4, minWidth: 16, height: 16, borderRadius: 8, background: overdueCount ? RED : ORANGE, color: "#fff", fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 3px" }}>
              {notifTasks.length}
            </span>
          )}
        </button>
      </div>

      {showNotifs && (
        <Modal onClose={() => setShowNotifs(false)} title="Сповіщення">
          {notifTasks.length === 0 ? (
            <EmptyState title="Немає найближчих сповіщень" subtitle="Дедлайни й події за 3 дні будуть з'являтись тут." />
          ) : (
            notifTasks.map((t) => (
              <TaskRow key={t.id} task={t} client={clients.find((c) => c.id === t.clientId)} onToggle={() => {}} onOpen={(id) => { setShowNotifs(false); onOpenTask && onOpenTask(id); }} />
            ))
          )}
        </Modal>
      )}
    </div>
  );
}

// ================================================================
// DASHBOARD
// ================================================================
function Dashboard({ tasks, clients, onToggle, onOpen }) {
  const today = todayISO();
  const todayTasks = tasks.filter((t) => t.due === today);
  const openToday = todayTasks.filter((t) => !t.done);
  const weekTasks = tasks.filter((t) => { const dd = daysUntil(t.due); return dd >= 0 && dd <= 7; });
  const overdue = tasks.filter((t) => !t.done && daysUntil(t.due) < 0);
  const [listView, setListView] = useState(null); // null | 'today' | 'week' | 'overdue'

  const lists = {
    today: { title: "Незакритих сьогодні", items: openToday },
    week: { title: "Всього цей тиждень", items: weekTasks },
    overdue: { title: "Прострочені задачі", items: overdue },
  };
  const active = listView ? lists[listView] : null;

  return (
    <div style={{ paddingTop: 16 }}>
      <button
        onClick={() => overdue.length && setListView("overdue")}
        style={{ width: "100%", textAlign: "left", border: "none", cursor: overdue.length ? "pointer" : "default", display: "flex", alignItems: "center", gap: 8, background: overdue.length ? "#fde8ec" : "#e1f7f2", color: overdue.length ? RED : GREEN, padding: "12px 14px", borderRadius: 12, fontSize: 14, marginBottom: 16 }}
      >
        <CheckSquare size={18} />
        {overdue.length ? `Прострочено задач: ${overdue.length}` : "Прострочень немає — усе за графіком"}
      </button>
      <div style={{ display: "flex", gap: 12, marginBottom: 20 }}>
        <StatCard value={openToday.length} label="Незакритих сьогодні" color="#e2a400" onClick={() => openToday.length && setListView("today")} />
        <StatCard value={weekTasks.length} label="Всього цей тиждень" color="#3b5bff" onClick={() => weekTasks.length && setListView("week")} />
      </div>
      <div style={{ fontSize: 13, color: TEXT_MUTED, fontWeight: 600, marginBottom: 10 }}>ЗАДАЧІ НА СЬОГОДНІ · {fmtDate(today)}</div>
      {todayTasks.length === 0 ? (
        <EmptyState title="На сьогодні задач немає" subtitle="Вільний день — або все вже зроблено." />
      ) : (
        todayTasks.map((t) => <TaskRow key={t.id} task={t} client={clients.find((c) => c.id === t.clientId)} onToggle={onToggle} onOpen={onOpen} />)
      )}

      {active && (
        <Modal onClose={() => setListView(null)} title={active.title}>
          {active.items.length === 0 ? (
            <EmptyState title="Тут порожньо" subtitle="Задач у цій категорії більше немає." />
          ) : (
            active.items.map((t) => <TaskRow key={t.id} task={t} client={clients.find((c) => c.id === t.clientId)} onToggle={onToggle} onOpen={(id) => { setListView(null); onOpen(id); }} />)
          )}
        </Modal>
      )}
    </div>
  );
}

function StatCard({ value, label, color, onClick }) {
  return (
    <button onClick={onClick} style={{ flex: 1, textAlign: "left", border: "none", cursor: onClick ? "pointer" : "default", background: CARD, borderRadius: 14, padding: "18px 14px", borderTop: `3px solid ${color}`, boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
      <div style={{ fontSize: 30, fontWeight: 700, color: TEXT_DARK }}>{value}</div>
      <div style={{ fontSize: 13, color: TEXT_MUTED, marginTop: 2 }}>{label}</div>
    </button>
  );
}
function EmptyState({ title, subtitle, action }) {
  return (
    <div style={{ background: CARD, borderRadius: 16, padding: "40px 20px", textAlign: "center", border: "1px dashed #ded9d0" }}>
      <div style={{ width: 64, height: 64, borderRadius: "50%", background: ORANGE_SOFT, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}>
        <Users size={26} color={ORANGE} />
      </div>
      <div style={{ fontWeight: 700, color: TEXT_DARK, fontSize: 18, marginBottom: 8 }}>{title}</div>
      <div style={{ color: TEXT_MUTED, fontSize: 14, lineHeight: 1.5, marginBottom: action ? 18 : 0 }}>{subtitle}</div>
      {action}
    </div>
  );
}

// ================================================================
// TASK ROW — clickable to open details; checkbox toggles done directly
// ================================================================
function TaskRow({ task, client, onToggle, onOpen, onDelete }) {
  const dd = daysUntil(task.due);
  const overdue = !task.done && dd < 0;
  const meta = typeMeta(task.type);
  const Icon = meta.icon;
  return (
    <div
      onClick={() => onOpen && onOpen(task.id)}
      style={{ background: CARD, borderRadius: 12, padding: "12px 14px", marginBottom: 8, display: "flex", alignItems: "center", gap: 12, boxShadow: "0 1px 3px rgba(0,0,0,0.04)", cursor: onOpen ? "pointer" : "default" }}
    >
      <button
        onClick={(e) => { e.stopPropagation(); onToggle(task.id); }}
        style={{ width: 22, height: 22, borderRadius: 6, border: `2px solid ${task.done ? GREEN : "#a8a5a0"}`, background: task.done ? GREEN : "transparent", flexShrink: 0, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}
      >
        {task.done && <Check size={14} color="#fff" />}
      </button>
      <div style={{ width: 30, height: 30, borderRadius: 8, background: meta.bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
        <Icon size={15} color={meta.color} />
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 14.5, color: TEXT_DARK, fontWeight: 600, textDecoration: task.done ? "line-through" : "none", opacity: task.done ? 0.5 : 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {task.title}
        </div>
        <div style={{ fontSize: 12.5, color: overdue ? RED : TEXT_MUTED, marginTop: 2 }}>
          {client ? client.name : "Особисте"} · {fmtDate(task.due)}{task.time ? ` о ${task.time}` : ""}{overdue ? " · прострочено" : ""}{task.amount ? ` · ${money(task.amount)} грн` : ""}
        </div>
      </div>
      {onDelete && (
        <button onClick={(e) => { e.stopPropagation(); onDelete(task.id); }} style={{ background: "none", border: "none", color: "#a8a5a0", cursor: "pointer", flexShrink: 0 }}>
          <Trash2 size={16} />
        </button>
      )}
    </div>
  );
}

// ================================================================
// CALENDAR — Таблиця (grid) / Список (grouped list)
// ================================================================
const CATEGORY_FILTERS = [
  { id: "all", label: "Усі задачі" },
  { id: "payment", label: "Сплата податків" },
  { id: "document", label: "Звітність" },
  { id: "other", label: "Інше" },
];
function matchesCategory(task, cat) {
  if (cat === "all") return true;
  if (cat === "other") return task.type === "event" || task.type === "personal";
  return task.type === cat;
}

function CalendarView({ tasks, clients, onToggle, onOpen }) {
  const [mode, setMode] = useState("table");
  const [cursor, setCursor] = useState(() => { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; });
  const [activeCell, setActiveCell] = useState(null); // { rowId, date }
  const [filterLevel, setFilterLevel] = useState("all");
  const [catFilter, setCatFilter] = useState("all");
  const [sortMode, setSortMode] = useState("urgency");

  const monthLabel = new Date(cursor.y, cursor.m, 1).toLocaleDateString("uk-UA", { month: "long", year: "numeric" });
  const nDays = daysInMonth(cursor.y, cursor.m);
  const days = Array.from({ length: nDays }, (_, i) => toISO(new Date(cursor.y, cursor.m, i + 1)));
  const today = todayISO();
  const isCurrentMonth = (() => { const t = ymd(today); return t.y === cursor.y && t.m === cursor.m; })();

  const filteredClients = filterLevel === "all" ? clients : clients.filter((c) => (c.serviceLevel || null) === filterLevel);
  const filteredClientIds = new Set(filteredClients.map((c) => c.id));
  const visibleTasks = (filterLevel === "all" ? tasks : tasks.filter((t) => t.clientId === null || filteredClientIds.has(t.clientId))).filter((t) => matchesCategory(t, catFilter));
  const hasFopClients = clients.some((c) => currentSystem(c).orgForm === "fop");

  const rows = [...filteredClients.map((c) => ({ id: c.id, label: c.name, sub: systemLabel(currentSystem(c).orgForm, currentSystem(c).taxSystem) })), { id: null, label: "Особисті", sub: "мої задачі" }];

  const nearestDue = (rowId) => {
    const t = visibleTasks.filter((x) => !x.done && (x.clientId ?? null) === rowId).sort((a, b) => a.due.localeCompare(b.due))[0];
    return t ? t.due : "9999-12-31";
  };
  const sortedRows =
    sortMode === "system" ? [...rows].sort((a, b) => a.sub.localeCompare(b.sub, "uk")) :
    [...rows].sort((a, b) => nearestDue(a.id).localeCompare(nearestDue(b.id)));

  const cellTasks = (rowId, date) => visibleTasks.filter((t) => (t.clientId ?? null) === rowId && t.due === date);

  return (
    <div style={{ paddingTop: 16 }}>
      <div style={{ display: "flex", background: NAVY, borderRadius: 12, padding: 4, marginBottom: 14 }}>
        {[["table", "Таблиця"], ["list", "Список"]].map(([id, label]) => (
          <button key={id} onClick={() => setMode(id)} style={{ flex: 1, padding: "10px 0", borderRadius: 9, border: "none", background: mode === id ? "#fff" : "transparent", color: mode === id ? NAVY : "#a8a5a0", fontWeight: 700, fontSize: 14.5, cursor: "pointer" }}>
            {label}
          </button>
        ))}
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        {hasFopClients && (
          <select value={filterLevel} onChange={(e) => setFilterLevel(e.target.value)} style={{ flex: 1, minWidth: 0, background: filterLevel === "all" ? "#fff" : ORANGE, color: filterLevel === "all" ? TEXT_DARK : "#fff", border: `1px solid ${filterLevel === "all" ? BORDER : ORANGE}`, borderRadius: 10, padding: "10px 8px", fontSize: 13, fontWeight: 600, appearance: "auto" }}>
            <option value="all">Усі клієнти</option>
            {SERVICE_LEVELS.map((l) => <option key={l.id} value={l.id}>{l.label}</option>)}
          </select>
        )}
        <select value={catFilter} onChange={(e) => setCatFilter(e.target.value)} style={{ flex: 1, minWidth: 0, background: catFilter === "all" ? "#fff" : NAVY, color: catFilter === "all" ? TEXT_DARK : "#fff", border: `1px solid ${catFilter === "all" ? BORDER : NAVY}`, borderRadius: 10, padding: "10px 8px", fontSize: 13, fontWeight: 600, appearance: "auto" }}>
          {CATEGORY_FILTERS.map((opt) => <option key={opt.id} value={opt.id}>{opt.label}</option>)}
        </select>
      </div>

      {mode === "table" ? (
        <>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14, marginBottom: 12 }}>
            <button onClick={() => setCursor((c) => { const d = new Date(c.y, c.m - 1, 1); return { y: d.getFullYear(), m: d.getMonth() }; })} style={navArrowStyle}>‹</button>
            <div style={{ fontWeight: 700, fontSize: 16, color: TEXT_DARK, textTransform: "capitalize" }}>{monthLabel}</div>
            <button onClick={() => setCursor((c) => { const d = new Date(c.y, c.m + 1, 1); return { y: d.getFullYear(), m: d.getMonth() }; })} style={navArrowStyle}>›</button>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
            <span style={{ fontSize: 13, color: TEXT_MUTED }}>Сортування</span>
            <select value={sortMode} onChange={(e) => setSortMode(e.target.value)} style={{ flex: 1, background: "#fff", border: `1px solid ${BORDER}`, borderRadius: 10, padding: "8px 10px", fontSize: 13.5, color: TEXT_DARK, appearance: "auto" }}>
              <option value="urgency">За терміновістю</option>
              <option value="system">За системою оподаткування</option>
            </select>
          </div>

          {filteredClients.length === 0 ? (
            <EmptyState title={clients.length === 0 ? "Задач ще немає" : "Немає клієнтів із цим типом супроводу"} subtitle={clients.length === 0 ? "Додайте клієнта — календар згенерується автоматично." : "Спробуйте інший фільтр."} />
          ) : (
            <div style={{ overflowX: "auto", background: CARD, borderRadius: 14, boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
              <div style={{ display: "inline-block", minWidth: "100%" }}>
                {/* header row */}
                <div style={{ display: "flex", borderBottom: `1px solid ${BORDER}` }}>
                  <div style={{ position: "sticky", left: 0, zIndex: 2, background: NAVY, color: "#fff", width: 108, flexShrink: 0, padding: "10px 10px", fontSize: 11, fontWeight: 700, letterSpacing: 0.4 }}>КЛІЄНТ</div>
                  {days.map((d) => {
                    const isToday = isCurrentMonth && d === today;
                    const dt = new Date(d + "T00:00:00");
                    return (
                      <div key={d} style={{ width: 40, flexShrink: 0, textAlign: "center", padding: "8px 0", background: isToday ? ORANGE : NAVY, color: "#fff" }}>
                        <div style={{ fontWeight: 700, fontSize: 13.5 }}>{String(dt.getDate()).padStart(2, "0")}</div>
                        <div style={{ fontSize: 9.5, opacity: 0.8, textTransform: "uppercase" }}>{dt.toLocaleDateString("uk-UA", { weekday: "short" }).replace(".", "")}</div>
                      </div>
                    );
                  })}
                </div>
                {/* rows */}
                {sortedRows.map((row, idx) => (
                  <div key={row.id ?? "personal"} style={{ display: "flex", borderBottom: idx === sortedRows.length - 1 ? "none" : `1px solid #f0eee9` }}>
                    <div style={{ position: "sticky", left: 0, zIndex: 1, background: CARD, width: 108, flexShrink: 0, padding: "10px 10px", overflow: "hidden" }}>
                      <div style={{ fontSize: 12.5, fontWeight: 700, color: TEXT_DARK, whiteSpace: "nowrap", textOverflow: "ellipsis", overflow: "hidden" }}>{row.label}</div>
                      <div style={{ fontSize: 10.5, color: TEXT_MUTED, whiteSpace: "nowrap", textOverflow: "ellipsis", overflow: "hidden" }}>{row.sub}</div>
                    </div>
                    {days.map((d) => {
                      const items = cellTasks(row.id, d);
                      const isToday = isCurrentMonth && d === today;
                      let dot = null;
                      if (items.length) {
                        const allDone = items.every((t) => t.done);
                        const anyOverdue = items.some((t) => !t.done && daysUntil(t.due) < 0);
                        const color = allDone ? GREEN : anyOverdue ? RED : ORANGE;
                        dot = (
                          <div style={{ width: 20, height: 20, borderRadius: "50%", background: color, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10.5, fontWeight: 700 }}>
                            {allDone ? <Check size={12} /> : items.length}
                          </div>
                        );
                      }
                      return (
                        <div key={d} onClick={() => items.length && setActiveCell({ rowId: row.id, date: d })} style={{ width: 40, flexShrink: 0, minHeight: 52, display: "flex", alignItems: "center", justifyContent: "center", background: isToday ? "#faf0d9" : "transparent", cursor: items.length ? "pointer" : "default" }}>
                          {dot}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      ) : (
        <>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
            <span style={{ fontSize: 13, color: TEXT_MUTED }}>Сортування</span>
            <select value={sortMode} onChange={(e) => setSortMode(e.target.value)} style={{ flex: 1, background: "#fff", border: `1px solid ${BORDER}`, borderRadius: 10, padding: "8px 10px", fontSize: 13.5, color: TEXT_DARK, appearance: "auto" }}>
              <option value="urgency">За терміновістю</option>
              <option value="system">За системою оподаткування</option>
            </select>
          </div>
          <ListView tasks={visibleTasks} clients={filteredClients} onToggle={onToggle} onOpen={onOpen} sortMode={sortMode} />
        </>
      )}

      {activeCell && (
        <Modal onClose={() => setActiveCell(null)} title={`${rows.find((r) => r.id === activeCell.rowId)?.label} · ${fmtDateFull(activeCell.date)}`}>
          {cellTasks(activeCell.rowId, activeCell.date).map((t) => (
            <TaskRow key={t.id} task={t} client={filteredClients.find((c) => c.id === t.clientId)} onToggle={onToggle} onOpen={(id) => { setActiveCell(null); onOpen(id); }} />
          ))}
        </Modal>
      )}
    </div>
  );
}
const navArrowStyle = { width: 34, height: 34, borderRadius: "50%", border: `1px solid ${BORDER}`, background: "#fff", color: TEXT_DARK, fontSize: 18, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" };

function ListView({ tasks, clients, onToggle, onOpen, sortMode }) {
  if (tasks.length === 0) {
    return <EmptyState title="Задач ще немає" subtitle="Додайте клієнта — календар згенерується автоматично." />;
  }

  const clientLabel = (t) => {
    const c = clients.find((cl) => cl.id === t.clientId);
    if (!c) return "Особисте";
    const sys = currentSystem(c);
    return systemLabel(sys.orgForm, sys.taxSystem) || "Без системи";
  };

  if (sortMode === "system") {
    const groups = {};
    tasks.forEach((t) => { const key = clientLabel(t); groups[key] = groups[key] || []; groups[key].push(t); });
    const keys = Object.keys(groups).sort((a, b) => a.localeCompare(b, "uk"));
    return (
      <div>
        {keys.map((key) => (
          <div key={key} style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 13, color: TEXT_MUTED, fontWeight: 600, marginBottom: 8 }}>{key.toUpperCase()}</div>
            {groups[key].sort((a, b) => a.due.localeCompare(b.due)).map((t) => (
              <TaskRow key={t.id} task={t} client={clients.find((c) => c.id === t.clientId)} onToggle={onToggle} onOpen={onOpen} />
            ))}
          </div>
        ))}
      </div>
    );
  }

  // "urgency" (за замовчуванням) — групування за датою
  const sorted = [...tasks].sort((a, b) => a.due.localeCompare(b.due));
  const groups = {};
  sorted.forEach((t) => { groups[t.due] = groups[t.due] || []; groups[t.due].push(t); });
  const dates = Object.keys(groups);
  return (
    <div>
      {dates.map((date) => (
        <div key={date} style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 13, color: TEXT_MUTED, fontWeight: 600, marginBottom: 8 }}>{fmtDate(date).toUpperCase()} {daysUntil(date) === 0 ? "· СЬОГОДНІ" : ""}</div>
          {groups[date].map((t) => <TaskRow key={t.id} task={t} client={clients.find((c) => c.id === t.clientId)} onToggle={onToggle} onOpen={onOpen} />)}
        </div>
      ))}
    </div>
  );
}

// ================================================================
// CLIENTS LIST
// ================================================================
function ClientsView({ clients, tasks, onDelete, onOpen, onAddClient }) {
  const [filterLevel, setFilterLevel] = useState("all");
  const [query, setQuery] = useState("");
  const bySearch = query.trim()
    ? clients.filter((c) => c.name.toLowerCase().includes(query.trim().toLowerCase()) || (c.rnokpp || "").includes(query.trim()))
    : clients;
  const filtered = filterLevel === "all" ? bySearch : bySearch.filter((c) => (c.serviceLevel || null) === filterLevel);
  const hasFopClients = clients.some((c) => currentSystem(c).orgForm === "fop");

  return (
    <div style={{ paddingTop: 16 }}>
      {clients.length > 0 && (
        <div style={{ position: "relative", marginBottom: 14 }}>
          <Search size={16} color="#a8a5a0" style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)" }} />
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Пошук за назвою або РНОКПП…"
            style={{ ...inputStyleLight, paddingLeft: 38 }}
          />
        </div>
      )}
      {hasFopClients && (
        <div style={{ display: "flex", gap: 8, overflowX: "auto", marginBottom: 14, paddingBottom: 2 }}>
          {[{ id: "all", label: "Усі клієнти" }, ...SERVICE_LEVELS.map((l) => ({ id: l.id, label: l.label }))].map((opt) => (
            <button
              key={opt.id}
              onClick={() => setFilterLevel(opt.id)}
              style={{ flexShrink: 0, padding: "8px 14px", borderRadius: 20, border: "none", background: filterLevel === opt.id ? ORANGE : "#fff", color: filterLevel === opt.id ? "#fff" : TEXT_DARK, fontSize: 13, fontWeight: 600, cursor: "pointer", boxShadow: filterLevel === opt.id ? "none" : "0 1px 3px rgba(0,0,0,0.06)" }}
            >
              {opt.label}
            </button>
          ))}
        </div>
      )}
      {filtered.length === 0 ? (
        <EmptyState
          title={clients.length === 0 ? "Ще немає клієнтів" : "Немає клієнтів із цим типом супроводу"}
          subtitle={clients.length === 0 ? "Додайте першого суб'єкта господарювання — TERMINAL згенерує його податковий календар." : "Спробуйте інший фільтр або додайте нового клієнта."}
          action={<button onClick={onAddClient} style={{ background: NAVY, color: "#fff", border: "none", borderRadius: 12, padding: "13px 22px", fontSize: 15, fontWeight: 600, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 8 }}><Plus size={18} /> Додати клієнта</button>}
        />
      ) : (
        filtered.map((c) => {
          const count = tasks.filter((t) => t.clientId === c.id && !t.done).length;
          const initials = c.name.split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
          const sys = currentSystem(c);
          const exempt = esvCoverage(c, todayISO(), todayISO()) === "full";
          return (
            <div key={c.id} onClick={() => onOpen(c.id)} style={{ background: CARD, borderRadius: 14, padding: 16, marginBottom: 10, display: "flex", alignItems: "center", gap: 14, borderLeft: `4px solid ${GREEN}`, boxShadow: "0 1px 3px rgba(0,0,0,0.04)", cursor: "pointer" }}>
              <div style={{ width: 44, height: 44, borderRadius: 10, background: NAVY, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 14, flexShrink: 0 }}>{initials}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 700, color: TEXT_DARK, fontSize: 15, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.name}</div>
                <div style={{ fontSize: 13, color: TEXT_MUTED, marginTop: 2 }}>
                  {systemLabel(sys.orgForm, sys.taxSystem)} · {count} відкрит{count === 1 ? "а" : "их"} задач{count === 1 ? "а" : ""}{exempt ? " · звільнений від ЄСВ" : ""}
                  {sys.orgForm === "fop" && c.serviceLevel ? ` · ${serviceLevelLabel(c.serviceLevel)}` : ""}
                </div>
              </div>
              <button onClick={(e) => { e.stopPropagation(); onDelete(c.id); }} style={{ background: "none", border: "none", color: "#a8a5a0", cursor: "pointer" }}><Trash2 size={16} /></button>
            </div>
          );
        })
      )}
    </div>
  );
}

// ================================================================
// CLIENT DETAIL — tasks + tax system history + ЄСВ exemption periods
// ================================================================
function ClientDetail({ client, tasks, onBack, onToggle, onDelete, onOpen, onAddTask, onChangeSystem, onAddEsvPeriod, onRemoveEsvPeriod, onUpdateProfitPeriod, onUpdateServiceLevel, onUpdateRegistrationInfo, onUpdateFlags }) {
  const overdue = tasks.filter((t) => !t.done && daysUntil(t.due) < 0).length;
  const today = tasks.filter((t) => !t.done && t.due === todayISO()).length;
  const future = tasks.filter((t) => !t.done && daysUntil(t.due) > 0).length;
  const upcoming = [...tasks].filter((t) => !t.done).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 6);
  const sys = currentSystem(client);
  const isFop = sys.orgForm === "fop";
  const isLegalGeneral = sys.orgForm === "legal" && sys.taxSystem === "legal_general";

  const [changingSystem, setChangingSystem] = useState(false);
  const [addingEsv, setAddingEsv] = useState(false);
  const [editingReg, setEditingReg] = useState(false);
  const [rnokppInput, setRnokppInput] = useState(client.rnokpp || "");
  const [addressInput, setAddressInput] = useState(client.regAddress || "");
  const [kvedsInput, setKvedsInput] = useState(client.kveds || "");
  const [editingFlags, setEditingFlags] = useState(false);

  return (
    <div>
      <div style={{ background: NAVY, padding: "20px 16px 22px", color: "#fff" }}>
        <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
          <button onClick={onBack} style={{ background: "none", border: "none", cursor: "pointer", marginTop: 2 }}><ArrowLeft size={22} color="#fff" /></button>
          <div>
            <div style={{ color: ORANGE, fontSize: 12, fontWeight: 700, letterSpacing: 0.5 }}>КЛІЄНТ</div>
            <div style={{ fontSize: 22, fontWeight: 700, marginTop: 2 }}>{client.name}</div>
            <div style={{ color: "#a8a5a0", fontSize: 13, marginTop: 2 }}>{systemLabel(sys.orgForm, sys.taxSystem)}</div>
          </div>
        </div>
      </div>
      <div style={{ padding: "16px" }}>
        <div style={{ display: "flex", gap: 10, marginBottom: 18 }}>
          <MiniStat value={overdue} label="Простр." color={RED} />
          <MiniStat value={today} label="Сьогодні" color="#e2a400" />
          <MiniStat value={future} label="Майбутнє" color="#3b5bff" />
        </div>

        {/* --- Реєстраційні дані --- */}
        <SectionCard>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <FieldLabel noMargin>Реєстраційні дані</FieldLabel>
            <button
              onClick={() => {
                if (editingReg) onUpdateRegistrationInfo({ rnokpp: rnokppInput.trim() || null, regAddress: addressInput.trim() || null, kveds: kvedsInput.trim() || null });
                setEditingReg((v) => !v);
              }}
              style={{ background: "none", border: "none", color: ORANGE, fontWeight: 700, fontSize: 13, cursor: "pointer" }}
            >
              {editingReg ? "Зберегти" : "Редагувати"}
            </button>
          </div>
          {editingReg ? (
            <div style={{ marginTop: 12 }}>
              <Field label="РНОКПП / ЄДРПОУ">
                <input value={rnokppInput} onChange={(e) => setRnokppInput(e.target.value)} placeholder="1234567890" style={inputStyleLight} />
              </Field>
              <Field label="Адреса реєстрації">
                <input value={addressInput} onChange={(e) => setAddressInput(e.target.value)} placeholder="м. Київ, вул. ..." style={inputStyleLight} />
              </Field>
              <Field label="КВЕДи">
                <textarea value={kvedsInput} onChange={(e) => setKvedsInput(e.target.value)} rows={2} style={{ ...inputStyleLight, resize: "vertical", fontFamily: "inherit" }} />
              </Field>
            </div>
          ) : (
            <div style={{ marginTop: 10, fontSize: 13.5, color: TEXT_DARK, lineHeight: 1.7 }}>
              <div><span style={{ color: TEXT_MUTED }}>РНОКПП / ЄДРПОУ:</span> {client.rnokpp || "не вказано"}</div>
              <div><span style={{ color: TEXT_MUTED }}>Адреса:</span> {client.regAddress || "не вказано"}</div>
              <div><span style={{ color: TEXT_MUTED }}>КВЕДи:</span> {client.kveds || "не вказано"}</div>
            </div>
          )}
        </SectionCard>

        {/* --- Система оподаткування --- */}
        <SectionCard>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <FieldLabel noMargin>Система оподаткування</FieldLabel>
            <button onClick={() => setChangingSystem((v) => !v)} style={{ background: "none", border: "none", color: ORANGE, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
              {changingSystem ? "Скасувати" : "Змінити"}
            </button>
          </div>
          <div style={{ marginTop: 10 }}>
            {[...client.history].sort((a, b) => b.from.localeCompare(a.from)).map((h) => (
              <div key={h.id} style={{ fontSize: 13, color: TEXT_MUTED, padding: "4px 0" }}>
                з {fmtDate(h.from)} — <span style={{ color: TEXT_DARK, fontWeight: 600 }}>{systemLabel(h.orgForm, h.taxSystem)}</span>
              </div>
            ))}
          </div>
          {changingSystem && (
            <ChangeSystemForm
              onCancel={() => setChangingSystem(false)}
              onSave={(orgForm, taxSystem, fromDate) => { onChangeSystem(orgForm, taxSystem, fromDate); setChangingSystem(false); }}
            />
          )}
        </SectionCard>

        {/* --- Тип супроводу (лише ФОП) --- */}
        {isFop && (
          <SectionCard>
            <FieldLabel>Тип супроводу</FieldLabel>
            {SERVICE_LEVELS.map((lvl) => (
              <RadioCard
                key={lvl.id}
                selected={(client.serviceLevel || "monthly") === lvl.id}
                onClick={() => onUpdateServiceLevel(lvl.id)}
                title={lvl.label}
                hint={lvl.note}
                compact
              />
            ))}
          </SectionCard>
        )}

        {/* --- Звітний період з прибутку (лише юрособа, загальна система) --- */}
        {isLegalGeneral && (
          <SectionCard>
            <FieldLabel>Звітний період з податку на прибуток</FieldLabel>
            <RadioCard
              selected={(client.profitReportingPeriod || "quarterly") === "quarterly"}
              onClick={() => onUpdateProfitPeriod("quarterly")}
              title="Квартальні декларації"
              hint="Обов'язково при доході понад 40 млн грн за минулий рік. Фінзвітність — до 30-го числа місяця після кварталу."
              compact
            />
            <RadioCard
              selected={(client.profitReportingPeriod || "quarterly") === "annual"}
              onClick={() => onUpdateProfitPeriod("annual")}
              title="Річна декларація"
              hint="Можливо при доході до 40 млн грн. Декларація та фінзвітність — разом, протягом 60 днів після завершення року."
              compact
            />
          </SectionCard>
        )}

        {/* --- ЄСВ «за себе» --- */}
        {isFop && (
          <SectionCard>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <FieldLabel noMargin>ЄСВ «за себе»</FieldLabel>
              <button onClick={() => setAddingEsv((v) => !v)} style={{ background: "none", border: "none", color: ORANGE, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
                {addingEsv ? "Скасувати" : "+ Період"}
              </button>
            </div>
            <div style={{ fontSize: 13, color: TEXT_MUTED, marginTop: 6 }}>
              Зараз: {esvCoverage(client, todayISO(), todayISO()) === "full" ? <span style={{ color: GREEN, fontWeight: 700 }}>звільнений</span> : <span style={{ color: TEXT_DARK, fontWeight: 700 }}>сплачує</span>}
            </div>
            {(client.esvPeriods || []).length > 0 && (
              <div style={{ marginTop: 10 }}>
                {[...client.esvPeriods].sort((a, b) => b.from.localeCompare(a.from)).map((p) => (
                  <div key={p.id} style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 0", borderTop: `1px solid #f0eee9` }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13.5, fontWeight: 600, color: TEXT_DARK }}>{esvReasonLabel(p.reason)}</div>
                      <div style={{ fontSize: 12.5, color: TEXT_MUTED, marginTop: 1 }}>з {fmtDate(p.from)} {p.to ? `по ${fmtDate(p.to)}` : "· безстроково"}</div>
                    </div>
                    <button onClick={() => onRemoveEsvPeriod(p.id)} style={{ background: "none", border: "none", color: "#a8a5a0", cursor: "pointer" }}><X size={16} /></button>
                  </div>
                ))}
              </div>
            )}
            {addingEsv && (
              <AddEsvPeriodForm onCancel={() => setAddingEsv(false)} onSave={(period) => { onAddEsvPeriod(period); setAddingEsv(false); }} />
            )}
          </SectionCard>
        )}

        <SectionCard>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <FieldLabel noMargin>Додаткові ознаки</FieldLabel>
            <button onClick={() => setEditingFlags((v) => !v)} style={{ background: "none", border: "none", color: ORANGE, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
              {editingFlags ? "Готово" : "Редагувати"}
            </button>
          </div>
          {editingFlags ? (
            <div style={{ marginTop: 12 }}>
              {FLAG_GROUPS.map((group) => (
                <div key={group.title} style={{ marginBottom: 16 }}>
                  <div style={{ fontSize: 13, color: TEXT_MUTED, marginBottom: 8 }}>{group.title}</div>
                  {group.flags.map((flag) => {
                    const checked = (client.flags || []).includes(flag.id);
                    return (
                      <div
                        key={flag.id}
                        onClick={() => onUpdateFlags(checked ? (client.flags || []).filter((f) => f !== flag.id) : [...(client.flags || []), flag.id])}
                        style={{ display: "flex", gap: 10, alignItems: "flex-start", padding: "8px 2px", cursor: "pointer" }}
                      >
                        <div style={{ width: 20, height: 20, borderRadius: "50%", border: `2px solid ${checked ? ORANGE : "#a8a5a0"}`, background: checked ? ORANGE : "transparent", flexShrink: 0, marginTop: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
                          {checked && <Check size={12} color="#fff" />}
                        </div>
                        <div>
                          <div style={{ fontSize: 14, fontWeight: 700, color: TEXT_DARK }}>{flag.label}</div>
                          <div style={{ fontSize: 12.5, color: TEXT_MUTED, marginTop: 1 }}>{flag.note}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          ) : (
            <div style={{ marginTop: 10, fontSize: 13.5, color: TEXT_DARK }}>
              {(client.flags || []).length === 0
                ? "Немає додаткових ознак"
                : (client.flags || []).map((fid) => FLAG_GROUPS.flatMap((g) => g.flags).find((f) => f.id === fid)?.label).filter(Boolean).join(", ")}
            </div>
          )}
        </SectionCard>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, marginTop: 6 }}>
          <div style={{ fontSize: 13, color: TEXT_MUTED, fontWeight: 600 }}>НАЙБЛИЖЧІ ЗАДАЧІ</div>
        </div>
        {upcoming.length === 0 ? (
          <EmptyState title="Задач немає" subtitle="Усі задачі закриті або ще не згенеровані." />
        ) : (
          upcoming.map((t) => <TaskRow key={t.id} task={t} client={client} onToggle={onToggle} onOpen={onOpen} onDelete={onDelete} />)
        )}
        <button onClick={onAddTask} style={{ width: "100%", marginTop: 8, background: "#fff", border: `1px dashed ${BORDER}`, borderRadius: 12, padding: "14px 0", fontSize: 14.5, fontWeight: 600, color: NAVY, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          <Plus size={18} /> Задача по клієнту
        </button>
      </div>
    </div>
  );
}
