// ================================================================
// DATE HELPERS
// ================================================================
function todayISO() {
  return toISO(new Date());
}
function toISO(d) {
  // локальні компоненти дати, НЕ toISOString() — інакше UTC-конвертація зсуває дату
  // на день назад уночі для часових поясів попереду UTC (напр. Україна після півночі)
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function fmtDate(iso) {
  return new Date(iso + "T00:00:00").toLocaleDateString("uk-UA", {
    day: "numeric",
    month: "long"
  });
}
function fmtDateFull(iso) {
  return new Date(iso + "T00:00:00").toLocaleDateString("uk-UA", {
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}
function daysUntil(iso) {
  const today = new Date(todayISO() + "T00:00:00");
  const target = new Date(iso + "T00:00:00");
  return Math.round((target - today) / 86400000);
}
function addDays(iso, n) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return toISO(d);
}
function addMonths(iso, n) {
  const d = new Date(iso + "T00:00:00");
  d.setMonth(d.getMonth() + n);
  return toISO(d);
}
function onDay(year, monthIdx, day) {
  return toISO(new Date(year, monthIdx, day));
}
function ymd(iso) {
  const d = new Date(iso + "T00:00:00");
  return {
    y: d.getFullYear(),
    m: d.getMonth(),
    d: d.getDate()
  };
}
function quarterEnd(iso) {
  const {
    y,
    m
  } = ymd(iso);
  const endMonth = Math.floor(m / 3) * 3 + 3;
  return toISO(new Date(y, endMonth, 0));
}
function quarterStart(iso) {
  const {
    y,
    m
  } = ymd(iso);
  return toISO(new Date(y, Math.floor(m / 3) * 3, 1));
}
function nextQuarterEndFrom(iso) {
  const qe = quarterEnd(iso);
  return qe >= iso ? qe : quarterEnd(addMonths(iso, 3));
}
function daysInMonth(year, monthIdx) {
  return new Date(year, monthIdx + 1, 0).getDate();
}
function firstOfNextMonth(iso) {
  const {
    y,
    m
  } = ymd(iso);
  return toISO(new Date(y, m + 1, 1));
}

// ================================================================
// TAX PROFILE HELPERS — history & exemption periods
// ================================================================
// client.history: [{ id, from: ISO, orgForm, taxSystem }] sorted ascending by `from`
function systemAt(client, iso) {
  const hist = [...(client.history || [])].sort((a, b) => a.from.localeCompare(b.from));
  if (hist.length === 0) return {
    orgForm: client.orgForm,
    taxSystem: client.taxSystem
  };
  let current = hist[0];
  for (const h of hist) {
    if (h.from <= iso) current = h;else break;
  }
  return current;
}
function currentSystem(client) {
  return systemAt(client, todayISO());
}

// client.esvPeriods: [{ id, from: ISO, to: ISO|null, reason }]
function esvCoverage(client, startISO, endISO) {
  const periods = client.esvPeriods || [];
  if (periods.length === 0) return "none";
  let anyExempt = false,
    anyNot = false;
  let d = startISO;
  let guard = 0;
  while (d <= endISO && guard < 120) {
    const covered = periods.some(p => p.from <= d && (!p.to || p.to >= d));
    if (covered) anyExempt = true;else anyNot = true;
    d = addDays(d, 1);
    guard++;
  }
  if (anyExempt && !anyNot) return "full";
  if (!anyExempt) return "none";
  return "partial";
}
// Найраніша дата в історії клієнта — фактичний початок діяльності/реєстрації
function registrationDate(client) {
  const hist = client.history || [];
  if (!hist.length) return null;
  return [...hist].sort((a, b) => a.from.localeCompare(b.from))[0].from;
}

// Частота зобов'язання: чим вище ранг, тим частіше воно виникає
const CADENCE_RANK = {
  monthly: 3,
  quarterly: 2,
  annual: 1
};

// ================================================================
// TAX CALENDAR GENERATOR — period-aware: the system/exemption in effect
// at each reporting period's end date governs that period's tasks.
// ================================================================
function generateTasksForClient(client, fromISO) {
  const tasks = [];
  const push = (title, type, due, note, cadence) => tasks.push({
    title,
    type,
    due,
    note: note || "",
    _cadence: cadence || null
  });
  const flags = client.flags || [];
  const has = f => flags.includes(f);
  const regDate = registrationDate(client);

  // ---- Quarterly cycle: ЄСВ + ЄП-декларації, залежно від системи, чинної на кінець кожного кварталу ----
  let qEnd = nextQuarterEndFrom(fromISO);
  for (let i = 0; i < 4; i++) {
    const qStart = quarterStart(qEnd);
    const sysHere = systemAt(client, qEnd);
    const isFop = sysHere.orgForm === "fop";
    const sys = sysHere.taxSystem;
    const {
      y: qy,
      m: qm
    } = ymd(qEnd);
    if (isFop) {
      const due = onDay(qy, qm + 1, 19);
      // дні до реєстрації клієнта не рахуються як "неexempt" — інакше щойно зареєстрований ФОП
      // з пільгою від першого дня завжди виглядав би як "частковий період"
      const effectiveStart = regDate && regDate > qStart ? regDate : qStart;
      const coverage = effectiveStart > qEnd ? "full" : esvCoverage(client, effectiveStart, qEnd);
      if (coverage === "none") {
        push(ESV_TASK_TITLE, "payment", due, "Нормативна задача — сплачується щоквартально всіма ФОП незалежно від групи.", "quarterly");
      } else if (coverage === "partial") {
        push(`${ESV_TASK_TITLE} (частковий період)`, "payment", due, "У кварталі є як звільнені, так і незвільнені дні — перевірте пропорційний розрахунок вручну.", "quarterly");
      }
      // "full" — звільнення покриває весь квартал (або клієнт ще не існував), задача не генерується
    }
    if (sys === "fop3" || sys === "legal_sp3") {
      const declDue = addDays(qEnd, 40);
      const payDue = addDays(declDue, 10);
      push(`Декларація ЄП — ${isFop ? "ФОП 3 групи" : "юрособа, гр. 3"}`, "document", declDue, "Нормативний термін: 40 днів після завершення кварталу.", "quarterly");
      push(`ЄП — ${isFop ? "ФОП 3 групи" : "юрособа гр.3"} (сплата)`, "payment", payDue, "Сплачується протягом 10 днів після граничного строку подання декларації.", "quarterly");
      if (isFop) push("ВЗ — ФОП 3 групи (військовий збір, 1% доходу)", "payment", payDue, "Сплачується разом із єдиним податком.", "quarterly");
    }
    if (sys === "legal_general" && (client.profitReportingPeriod || "quarterly") === "quarterly") {
      const declDue = addDays(qEnd, 40);
      push("Декларація з податку на прибуток (квартальна)", "document", declDue, "Наростаючим підсумком з початку року.", "quarterly");
      push("Податок на прибуток (сплата)", "payment", addDays(declDue, 10), null, "quarterly");
      push("Проміжна фінансова звітність (баланс, звіт про фінрезультати)", "document", addDays(qEnd, 30), "Подається до ДПС і Держстату не пізніше 30-го числа місяця, що настає за звітним кварталом — раніше за саму декларацію з прибутку.", "quarterly");
    }
    if (sys === "legal_sp4") {
      push("ЄП 4 група — квартальний авансовий платіж", "payment", addDays(qEnd, 30), null, "quarterly");
    }
    qEnd = quarterEnd(addMonths(qEnd, 3));
  }

  // ---- Monthly cycle: ЄП + ВЗ для 1/2 групи ФОП, залежно від системи, чинної на кінець місяця ----
  let mCursor = fromISO;
  for (let i = 0; i < 13; i++) {
    const {
      y,
      m
    } = ymd(mCursor);
    const monthEnd = toISO(new Date(y, m + 1, 0));
    const sysHere = systemAt(client, monthEnd);
    const due = onDay(y, m, 20);
    if (sysHere.orgForm === "fop" && (sysHere.taxSystem === "fop1" || sysHere.taxSystem === "fop2") && due >= fromISO) {
      const groupLabel = sysHere.taxSystem === "fop1" ? "1 група" : "2 група";
      push(`Єдиний податок — ${groupLabel}`, "payment", due, null, "monthly");
      push(`Військовий збір — ${groupLabel}`, "payment", due, "Фіксований авансовий внесок, сплачується разом із єдиним податком.", "monthly");
    }
    mCursor = addMonths(mCursor, 1);
  }

  // ---- Annual: декларація ЄП для 1/2 групи ФОП (до 9 лютого) ----
  {
    const year = ymd(fromISO).y;
    let declDue = onDay(year, 1, 9);
    if (declDue < fromISO) declDue = onDay(year + 1, 1, 9);
    const sysHere = systemAt(client, declDue);
    if (sysHere.orgForm === "fop" && (sysHere.taxSystem === "fop1" || sysHere.taxSystem === "fop2")) {
      push("Декларація платника єдиного податку (річна)", "document", declDue, "Річна декларація — навіть за відсутності діяльності.", "annual");
    }
  }
  // ---- Annual: декларація про майновий стан і доходи — ФОП на загальній системі (до 1 травня) ----
  {
    const year = ymd(fromISO).y;
    let declDue = onDay(year, 4, 1);
    if (declDue < fromISO) declDue = onDay(year + 1, 4, 1);
    const sysHere = systemAt(client, declDue);
    if (sysHere.orgForm === "fop" && sysHere.taxSystem === "fop_general") {
      push("Декларація про майновий стан і доходи (річна)", "document", declDue, "Подається раз на рік, якщо був дохід у звітному періоді.", "annual");
    }
  }
  // ---- Annual: декларація з прибутку + фінзвітність — юрособа на загальній системі, якщо обрано річний період ----
  {
    const year = ymd(fromISO).y;
    let yearEnd = onDay(year, 11, 31);
    let declDue = addDays(yearEnd, 60);
    if (declDue < fromISO) {
      yearEnd = onDay(year + 1, 11, 31);
      declDue = addDays(yearEnd, 60);
    }
    const sysHere = systemAt(client, declDue);
    if (sysHere.taxSystem === "legal_general" && (client.profitReportingPeriod || "quarterly") === "annual") {
      push("Декларація з податку на прибуток (річна)", "document", declDue, "Граничний строк — 60 календарних днів після завершення звітного року.", "annual");
      push("Податок на прибуток (сплата)", "payment", addDays(declDue, 10), null, "annual");
      push("Річна фінансова звітність (баланс, звіт про фінрезультати)", "document", declDue, "Подається разом із річною декларацією з податку на прибуток.", "annual");
    }
  }
  // ---- Annual: декларація ЄП 4 група (до 20 лютого) ----
  {
    const year = ymd(fromISO).y;
    let declDue = onDay(year, 1, 20);
    if (declDue < fromISO) declDue = onDay(year + 1, 1, 20);
    const sysHere = systemAt(client, declDue);
    if (sysHere.taxSystem === "legal_sp4") {
      push("Декларація платника ЄП (4 група, сільгосп)", "document", declDue, "Подається щорічно до 20 лютого.", "annual");
    }
  }

  // ---- Перехідна звітність: попередня система в історії, якщо клієнт змінював систему ----
  {
    const hist = [...(client.history || [])].sort((a, b) => a.from.localeCompare(b.from));
    for (let i = 1; i < hist.length; i++) {
      const prev = hist[i - 1];
      const switchDate = hist[i].from;
      if (switchDate < fromISO) continue; // перехід уже в минулому — не нагадуємо заново
      push(`Перевірити перехідну звітність (${systemLabel(prev.orgForm, prev.taxSystem)} → ${systemLabel(hist[i].orgForm, hist[i].taxSystem)})`, "document", addDays(switchDate, 5), `Період на попередній системі: з ${fmtDate(prev.from)} по ${fmtDate(addDays(switchDate, -1))}. Перевірте, чи потрібна окрема закриваюча звітність за цей період — автоматична логіка цього не визначає.`);
    }
  }

  // ---- Додаткові ознаки (не прив'язані до періодів — застосовуються, поки увімкнені) ----
  if (has("employees")) {
    let cursor = fromISO;
    for (let i = 0; i < 6; i++) {
      const {
        y,
        m
      } = ymd(cursor);
      push("ПДФО, ВЗ і ЄСВ із зарплати працівників", "payment", onDay(y, m + 1, 20), null, "monthly");
      cursor = addMonths(cursor, 1);
    }
    let qe = nextQuarterEndFrom(fromISO);
    for (let i = 0; i < 4; i++) {
      push("Об'єднана звітність (Додаток 4ДФ)", "document", addDays(qe, 40), null, "quarterly");
      qe = quarterEnd(addMonths(qe, 3));
    }
